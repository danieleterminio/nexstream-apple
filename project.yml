name: NexStream
options:
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/NexStream-Bridging-Header.h
    CLANG_ENABLE_MODULES: "YES"
    GCC_WARN_INHIBIT_ALL_WARNINGS: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  NexStream:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: App/Bridge
      - path: PythonApp
        type: folder
        buildPhase: resources
      - path: Resources/s4me
        type: folder
        buildPhase: resources
      - path: Resources/s4me_data
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: build/gen/iOS-Info.plist
      properties:
        CFBundleDisplayName: NexStream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarSceneDelegate
        INIntentsSupported: [INPlayMediaIntent]
        NSSiriUsageDescription: Con Siri puoi chiedere a NexStream di riprodurre un canale, un film o una serie, anche dall'auto.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIAppFonts: [Manrope.ttf, Sora.ttf]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: NexStream usa la rete di casa per fare da telecomando alla TV e per passare linea e profili tra i tuoi dispositivi.
        NSBonjourServices: [_nexremote._tcp, _nexstream._tcp]
        LSApplicationQueriesSchemes: [nordvpn, expressvpn, surfshark, protonvpn, piavpn, mullvadvpn, wireguard]
        NSCameraUsageDescription: La fotocamera serve a leggere il codice QR mostrato dalla TV.
        CFBundleURLTypes:
          - CFBundleURLName: app.nexstream.one
            CFBundleURLSchemes: [nexstream]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexstream.one
        PRODUCT_NAME: NexStream
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - framework: Frameworks/iOS/Python.xcframework
        embed: true
      - framework: Frameworks/iOS/MobileVLCKit.xcframework
        embed: true
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libbz2.tbd
    postBuildScripts:
      - name: Install Python
        script: |
          "$PROJECT_DIR/scripts/install_python.sh" iOS
        basedOnDependencyAnalysis: false
  NexStreamTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Shared
      - path: App/tvOS
      - path: App/Bridge
      - path: PythonApp
        type: folder
        buildPhase: resources
      - path: Resources/s4me
        type: folder
        buildPhase: resources
      - path: Resources/s4me_data
        type: folder
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: build/gen/tvOS-Info.plist
      properties:
        CFBundleDisplayName: NexStream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts: [Manrope.ttf, Sora.ttf]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: NexStream usa la rete di casa per ricevere i comandi dal telefono e per passare linea e profili tra i tuoi dispositivi.
        NSBonjourServices: [_nexremote._tcp, _nexstream._tcp]
        LSApplicationQueriesSchemes: [nordvpn, expressvpn, surfshark, protonvpn, piavpn, mullvadvpn, wireguard]
        CFBundleURLTypes:
          - CFBundleURLName: app.nexstream.one
            CFBundleURLSchemes: [nexstream]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexstream.one
        PRODUCT_NAME: NexStream
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
    # Top Shelf feed shared with the extension; only effective when the signing profile has this App Group
    entitlements:
      path: build/gen/NexStreamTV.entitlements
      properties:
        com.apple.security.application-groups: [group.app.nexstream.one]
    dependencies:
      - target: NexStreamTopShelf
      - framework: Frameworks/tvOS/Python.xcframework
        embed: true
      - framework: Frameworks/tvOS/TVVLCKit.xcframework
        embed: true
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libbz2.tbd
    postBuildScripts:
      - name: Install Python
        script: |
          "$PROJECT_DIR/scripts/install_python.sh" tvOS
        basedOnDependencyAnalysis: false
  # Apple TV home rows above the icon ("Continua a guardare", favourite channels): reads the feed the app writes
  NexStreamTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: App/TopShelf
      - path: App/Shared/Core/TopShelfFeed.swift
    info:
      path: build/gen/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: NexStream
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: build/gen/NexStreamTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.app.nexstream.one]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexstream.one.topshelf
        PRODUCT_NAME: NexStreamTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
schemes:
  NexStream:
    build:
      targets:
        NexStream: all
    run:
      config: Debug
  NexStreamTV:
    build:
      targets:
        NexStreamTV: all
    run:
      config: Debug
