name: build

on:
  workflow_dispatch:
    inputs:
      what:
        description: "sim = build both for the simulator and take screenshots · ios / tv = one platform · ipa = unsigned device builds · uitest = Apple TV remote UI tests"
        default: sim
      shots:
        description: "screenshots: name:seconds:launch args|name:seconds:args (empty = one after 25 s)"
        default: ""
      pair:
        description: "1 = also pair the iPhone simulator as remote of the Apple TV simulator (VPN off on both)"
        default: ""
      filter:
        description: "uitest only: Class or Class/testName, separated by commas (empty = all)"
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      WHAT: ${{ github.event.inputs.what || 'sim' }}
      NX_SHOTS: ${{ github.event.inputs.shots }}
      NX_PAIR: ${{ github.event.inputs.pair }}
      NX_FILTER: ${{ github.event.inputs.filter }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -E "iPhone 17|Apple TV" || true

      - name: Cache frameworks
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: fw-py313b18-vlc360-v1

      - name: Fetch frameworks
        run: bash scripts/fetch_frameworks.sh

      - name: Secrets
        env:
          MEGAOTT_API_TOKEN: ${{ secrets.MEGAOTT_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash scripts/write_secrets.sh

      - name: XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build iOS (simulator)
        if: env.WHAT == 'sim' || env.WHAT == 'ios'
        run: bash scripts/ci_build.sh NexStream iphonesimulator

      - name: Build tvOS (simulator)
        if: (success() || failure()) && (env.WHAT == 'sim' || env.WHAT == 'tv')
        run: bash scripts/ci_build.sh NexStreamTV appletvsimulator

      - name: Run in the simulators
        if: (success() || failure()) && env.WHAT != 'ipa' && env.WHAT != 'uitest'
        run: |
          case "$WHAT" in ios) bash scripts/ci_run.sh ios ;; tv) bash scripts/ci_run.sh tv ;; *) bash scripts/ci_run.sh all ;; esac

      - name: Unsigned device builds (IPA)
        if: env.WHAT == 'ipa'
        run: bash scripts/ci_ipa.sh

      - name: Apple TV UI tests (simulator)
        if: env.WHAT == 'uitest'
        run: bash scripts/ci_uitest.sh "$NX_FILTER"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            build/out
            !build/out/uitest.xcresult
          retention-days: 7
