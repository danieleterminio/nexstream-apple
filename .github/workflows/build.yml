name: build

on:
  workflow_dispatch:
    inputs:
      what:
        description: "sim = build both for the simulator and take screenshots · ios / tv = one platform · ipa = unsigned device builds"
        default: sim
      shots:
        description: "screenshots: name:seconds:launch args|name:seconds:args (empty = one after 25 s)"
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      WHAT: ${{ github.event.inputs.what || 'sim' }}
      NX_SHOTS: ${{ github.event.inputs.shots }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Cache frameworks
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: fw-py313b18-vlc360-v1

      - name: Fetch frameworks
        run: bash scripts/fetch_frameworks.sh

      - name: Secrets
        env:
          MEGAOTT_API_TOKEN: ${{ secrets.MEGAOTT_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash scripts/write_secrets.sh

      - name: XcodeGen
        run: |
          which xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build iOS (simulator)
        if: env.WHAT == 'sim' || env.WHAT == 'ios'
        run: bash scripts/ci_build.sh NexStream iphonesimulator

      - name: Build tvOS (simulator)
        if: (success() || failure()) && (env.WHAT == 'sim' || env.WHAT == 'tv')
        run: bash scripts/ci_build.sh NexStreamTV appletvsimulator

      - name: Run in the simulators
        if: (success() || failure()) && env.WHAT != 'ipa'
        run: |
          case "$WHAT" in ios) bash scripts/ci_run.sh ios ;; tv) bash scripts/ci_run.sh tv ;; *) bash scripts/ci_run.sh all ;; esac

      - name: Unsigned device builds (IPA)
        if: env.WHAT == 'ipa'
        run: bash scripts/ci_ipa.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: build/out
          retention-days: 7
